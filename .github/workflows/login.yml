name: 🚀 Build & Deploy Reset Password Service to EC2

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    name: 🐳 Build & Push Docker Image + ☁️ Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Clonar repositorio
        uses: actions/checkout@v3

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Construir y subir imagen Docker
        run: |
          echo "📦 Construyendo imagen reset-password-service..."
          docker build -t agente47/reset-password-service:latest .

          echo "☁️ Subiendo imagen a Docker Hub..."
          docker push agente47/reset-password-service:latest

      - name: 🚀 Desplegar en EC2 por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🛠️ Instalando Docker y Docker Compose si no existen..."
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            echo "📝 Creando archivo .env.reset-password-service..."
            cat <<EOF | sudo tee /home/ec2-user/.env.reset-password-service
            PORT=4004
            MYSQL_DB_HOST=50.16.111.165
            MYSQL_DB_PORT=3306
            MYSQL_DB_USER=serious
            MYSQL_DB_PASSWORD=123456
            MYSQL_DB_NAME=users_db
            JWT_SECRET=mysecretkey1234
            EMAIL_USER=andyricardog234@gmail.com
            EMAIL_PASS=tuqs zlzi dtst usig
            EOF

            echo "📥 Descargando imagen desde Docker Hub..."
            sudo docker pull agente47/reset-password-service:latest

            echo "🔌 Verificando red 'my_global_network'..."
            sudo docker network inspect my_global_network >/dev/null 2>&1 || \
              sudo docker network create my_global_network

            echo "🛑 Deteniendo contenedor anterior (si existe)..."
            sudo docker stop reset-password-service || true
            sudo docker rm reset-password-service || true

            echo "🚀 Iniciando contenedor actualizado..."
            sudo docker run -d --name reset-password-service \
              --env-file /home/ec2-user/.env.reset-password-service \
              -p 4012:4012 \
              --network my_global_network \
              agente47/reset-password-service:latest

            echo "✅ Despliegue completadoo con éxito..."
